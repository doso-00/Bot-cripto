[project]
name = "bot-cripto"
version = "0.1.0"
description = "Bot di trading spot su Binance: backtest, paper trading sul Testnet, misurazione onesta delle performance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt",
    "duckdb",
    "pandas",
    "plotly",
    "pydantic",
    "python-dotenv",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
