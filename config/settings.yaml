# Parametri generali (brief §11). Valori di default, versionati.
symbols:
  - BTC/USDT
  - ETH/USDT
timeframe: 1h
comparison_timeframe: 4h
history_start: "2020-01-01"

initial_capital_usdt: 1000
fee_rate: 0.001          # 0,1% per lato: verificare il proprio livello commissioni sul conto
slippage_rate: 0.0005    # 0,05% per lato

# Split temporale fisso (brief §6.2): il test parte dal giorno dopo validation_end
train_end: "2023-12-31"
validation_end: "2024-12-31"

min_rebalance_delta: 0.1

# Soglie del controllo qualità dati (brief §4.4). Vedi docs/DECISIONI.md per la motivazione.
data_quality:
  # Variazione close-to-close oltre la quale una candela è segnalata come "salto anomalo"
  max_abs_return:
    1h: 0.15
    4h: 0.20
  # Differenza tra open e close della candela precedente oltre la quale si segnala un "gap"
  # (su un mercato 24/7 open e close precedente dovrebbero quasi coincidere)
  max_open_gap: 0.02
  # Tolleranza relativa nel confronto tra candele 4h scaricate e 4h ricostruite dalle 1h
  resample_tolerance: 0.000001

# Regimi di mercato per l'analisi dei risultati (definizione fissata il 2026-10-23, vedi
# docs/DECISIONI.md): rendimento delle ultime lookback_days giornate oltre ±threshold
regimes:
  lookback_days: 90
  threshold: 0.15

paths:
  raw_data: data/raw
  database: data/market.duckdb
  reports: reports
  logs: logs
  known_events: config/known_events.yaml
