# Buchi nei dati verificati e spiegati (brief §9, Fase 1: "nessun buco non spiegato").
# Un buco è l'intervallo di candele mancanti tra due candele presenti. Si aggiunge qui
# SOLO dopo averne verificato la causa (es. manutenzione annunciata da Binance).
# Il report di qualità considera "spiegato" un buco se è interamente coperto da una voce
# con stesso simbolo (o "*" per tutti) e stesso timeframe (o "*").
#
# Formato:
# - symbol: "*"                    # oppure BTC/USDT
#   timeframe: "*"                 # oppure 1h / 4h
#   start: "2020-01-01T00:00:00"   # prima candela mancante (UTC, open_time)
#   end: "2020-01-01T02:00:00"     # ultima candela mancante (UTC, open_time)
#   reason: "Manutenzione programmata Binance (link all'annuncio)"
known_gaps: []
