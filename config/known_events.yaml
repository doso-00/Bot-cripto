# Eventi noti che spiegano buchi e anomalie nei dati (brief §9, Fase 1: "nessun buco non spiegato").
#
# Ogni voce è un intervallo di tempo UTC [start, end) in cui l'exchange era fermo o i dati sono
# anomali per una causa nota. Il controllo qualità considera "spiegati":
# - i buchi interamente contenuti nell'intervallo;
# - le candele interamente contenute nell'intervallo con close_time anomalo o volume zero
#   (l'ultima candela prima di un fermo si chiude in anticipo, quando il trading si interrompe).
# Per i timeframe più lunghi l'intervallo si allarga ai confini delle candele: un fermo dalle
# 11:00 alle 17:00 tocca le candele 4h delle 08:00, 12:00 e 16:00.
#
# Come sono state compilate le voci attuali (2026-10-24, dal report di qualità):
# - start = un'ora prima della prima candela mancante (include la candela che si chiude in
#   anticipo all'inizio del fermo); end = fine dell'ultima candela mancante;
# - "misurato": il buco è identico su tutti i simboli e timeframe scaricati, quindi è un fermo
#   dell'exchange e non un problema di download;
# - "source": presente solo dove la causa è confermata da una fonte esterna. Le altre restano
#   fermi misurati con causa non verificata (molti iniziano alle 02:00 UTC, orario tipico delle
#   manutenzioni programmate di Binance: è un'ipotesi, non un dato).
#
# Formato di una voce:
# - symbol: "*"                    # oppure BTC/USDT
#   timeframe: "*"                 # oppure 1h / 4h
#   start: "2020-01-01T00:00:00"   # inizio (UTC, incluso)
#   end: "2020-01-01T02:00:00"     # fine (UTC, escluso)
#   reason: "..."
#   source: "https://..."          # facoltativo
